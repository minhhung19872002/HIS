# =============================================================================
# HSMT Muc II — HE THONG TRUYEN TAI DU LIEU NGUOI DUNG (VPS Cloud)
# Cau hinh toi thieu theo HSMT: SSD >= 15GB, RAM >= 2GB, CPU >= 2 core.
#
# Stack nay CO Y giu that gon de vua ngan sach do:
#   caddy  ~30MB   TLS + reverse proxy (chung chi DV SSL Let's Encrypt — HSMT I.4)
#   relay  ~120MB  chuyen tiep thong bao sang FCM
#   tong   ~150MB / 2048MB
#
# Khong dat redis o day: hang doi thong bao da nam trong bang push_outbox tai data center,
# them mot hang doi thu hai chi tao them cho de mat thong bao chu khong giup gi.
#
# Nhung dieu VPS nay KHONG lam:
#   - Khong luu bat ky du lieu y te nao. Khong co CSDL.
#   - Khong mo duong tu Internet vao data center. Chieu ket noi luon la DC -> VPS.
#
# Khoi dong:
#   cp .env.example .env && cp fcm-service-account.json.example fcm-service-account.json
#   docker compose up -d
# =============================================================================

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: patientapp-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # chung chi Let's Encrypt — mat volume nay la phai xin lai chung chi
      - caddy_config:/config
    environment:
      # Domain cong khai cua app, vi du app.benhvien.vn
      PATIENTAPP_DOMAIN: ${PATIENTAPP_DOMAIN:?bat buoc dat trong .env}
      # Email nhan canh bao truoc khi chung chi het han.
      ACME_EMAIL: ${ACME_EMAIL:?bat buoc dat trong .env}
    depends_on:
      - relay
    restart: unless-stopped
    networks:
      - relay-net

  relay:
    image: ${RELAY_IMAGE:-his-patientapp-relay:local}
    # Build tu nguon khi chua co anh dung san. Truoc day o day chi co `image:` tro vao ghcr,
    # nhung khong CI nao build va day anh do len — nen `docker compose up -d` tren mot VPS moi
    # chet ngay voi "manifest unknown", dung cai lenh ghi trong so tay trien khai.
    build:
      context: ../..
      dockerfile: backend/src/HIS.PatientApp.Relay/Dockerfile
    container_name: patientapp-relay
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Relay__ApiKey: ${RELAY_API_KEY:?bat buoc dat trong .env, toi thieu 24 ky tu}
      # De trong hai bien nay thi relay chay o CHE DO GIA: ghi thong bao vao log thay vi gui sang
      # Firebase. Du de dung ca tang VPS len va nghiem thu muc II ma khong can khoa Firebase.
      # Dat chung vao la tu chuyen sang gui that. Kiem bang: curl /health -> "mode":"fcm".
      Fcm__ProjectId: ${FCM_PROJECT_ID:-}
      Fcm__CredentialsPath: ${FCM_CREDENTIALS_PATH:-/run/secrets/fcm-service-account.json}
    volumes:
      # Gan CA THU MUC chu khong gan rieng file: bind-mount mot file chua ton tai thi Docker tao ra
      # mot THU MUC trung ten, roi relay doc no nhu khoa va chet voi mot loi kho hieu. Gan thu muc
      # thi thieu khoa chi don gian la khong co file -> relay tu chuyen sang che do gia.
      # Khoa Firebase chi ton tai tren VPS; data center benh vien khong can biet khoa nay.
      - ./secrets:/run/secrets:ro
    # Khong publish cong: chi Caddy trong cung mang goi vao.
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - relay-net

volumes:
  caddy_data:
    name: patientapp_caddy_data
  caddy_config:
    name: patientapp_caddy_config

networks:
  relay-net:
    name: patientapp-relay-net
    driver: bridge
