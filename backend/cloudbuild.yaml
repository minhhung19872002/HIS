# ============================================================
# ⚠️  OBSOLETE — DO NOT USE
# ============================================================
# Production build dùng /cloudbuild.yaml ở root repo
# (chạy từ root context, có logging + timeout đầy đủ).
#
# Lệnh deploy chuẩn:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_IMAGE=<tag> \
#     --project=project-4d4a3f8e-d582-4536-97f
#
# File này giữ làm fallback nếu cần build từ backend/ subdir.
# Xóa được nếu xác nhận không ai dùng (Roadmap M2).
# ============================================================
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - src/HIS.API/Dockerfile
      - -t
      - ${_IMAGE_URI}
      - .
images:
  - ${_IMAGE_URI}
