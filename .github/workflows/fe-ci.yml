name: FE unit tests

# #212: vitest gate cho frontend — chạy trên mọi push/PR chạm frontend/**.
# Vercel vẫn tự deploy; gate này là lưới chặn regression logic thuần
# (envelope-unwrap, format, csv, validation) trước khi code tới prod.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/fe-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch: {}

concurrency:
  group: fe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit
