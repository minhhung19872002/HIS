name: Deploy to AWS EC2

# Tự động build + deploy lên AWS EC2 khi push vào main.
# (Migrated off Azure Container Apps 2026-08-15 — Azure SQL free quota exhausted,
#  toàn bộ app + DB chuyển sang AWS: RDS SQL Server Express + EC2 ap-southeast-1.)
#
# Image chứa CẢ SPA (Vite build → /app/clientapp) để FE và API cùng origin:
# hết CORS, cookie first-party, SignalR chạy URL tương đối. Build context là
# GỐC REPO và workflow chạy cả khi chỉ đổi frontend/**.
#
# Deploy qua AWS SSM send-command (KHÔNG mở SSH cho GitHub runners):
# EC2 i-026ea43bb85a2044b mang instance-profile his-ec2-ssm; IAM user his-ci
# chỉ được ssm:SendCommand vào đúng instance này. Container topology trên EC2:
# caddy (80/443, HTTPS Let's Encrypt cho his.bluestar.com.vn) → his-api:8080,
# cả hai trên docker network his-net, env tại /home/ec2-user/his-app.env.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

# Không cho 2 lần deploy chạy chồng nhau; lần mới xếp hàng đợi lần trước xong.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPO: ghcr.io/minhhung19872002/his-api
  AWS_REGION: ap-southeast-1
  EC2_INSTANCE_ID: i-026ea43bb85a2044b
  APP_URL: https://his.bluestar.com.vn

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # #191: TEST GATE — dotnet test chạy TRƯỚC build/deploy; test đỏ → job fail → KHÔNG deploy.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run backend tests (gate)
        run: dotnet test backend/tests/HIS.Tests/HIS.Tests.csproj -c Release --nologo

      - name: Compute image tag
        id: img
        run: echo "tag=${IMAGE_REPO}:$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u minhhung19872002 --password-stdin

      # Context = gốc repo (không phải backend/) vì stage 1 build luôn frontend/.
      # VITE_ORTHANC_URL = địa chỉ Orthanc mà TRÌNH DUYỆT mở trực tiếp (Orthanc Explorer /
      # OHIF / tải archive) — bake lúc build SPA, lấy từ repo variable (Settings → Variables →
      # Actions). Để trống thì UI tự khoá các nút mở Orthanc thay vì trỏ về localhost.
      - name: Build image
        run: >-
          docker build -f backend/src/HIS.API/Dockerfile
          --build-arg VITE_ORTHANC_URL="${{ vars.VITE_ORTHANC_URL }}"
          -t "${{ steps.img.outputs.tag }}" .

      - name: Push image
        run: docker push "${{ steps.img.outputs.tag }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Deploy = SSM chạy script trên EC2: pull image mới → thay container his-api.
      # ghcr login trên EC2 dùng credential đã lưu sẵn từ lần `docker login` đầu
      # (root của EC2 giữ ~/.docker/config.json) — KHÔNG truyền GHCR_TOKEN qua SSM.
      - name: Deploy to EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ steps.img.outputs.tag }}" \
            --parameters "commands=[
              \"set -e\",
              \"docker pull ${{ steps.img.outputs.tag }}\",
              \"docker rm -f his-api || true\",
              \"docker run -d --name his-api --restart unless-stopped --network his-net --env-file /home/ec2-user/his-app.env ${{ steps.img.outputs.tag }}\",
              \"docker image prune -af --filter until=72h || true\"
            ]" \
            --query "Command.CommandId" --output text)
          echo "command: $CMD_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "deploy OK"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "deploy $STATUS"; aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text; exit 1 ;;
              *) sleep 10 ;;
            esac
          done
          echo "deploy polling timed out"; exit 1

      - name: Smoke test (login endpoint)
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 120 -X POST "$APP_URL/api/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"Admin@123"}') && [ "$CODE" = "200" ] && exit 0
            echo "attempt $i: HTTP $CODE — retrying in 20s"; sleep 20
          done
          echo "Smoke test failed"; exit 1

      # SPA đi kèm trong image: shell phải render được, và route server phải vẫn 404
      # thật (không được trả 200 text/html — dấu hiệu fallback nuốt nhầm /api).
      - name: Smoke test (SPA shell + fallback guard)
        run: |
          SHELL_BODY=$(curl -sS -m 60 "$APP_URL/")
          echo "$SHELL_BODY" | grep -q 'id="root"' || { echo "SPA shell missing"; exit 1; }
          DEEP=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$APP_URL/v2/reception")
          [ "$DEEP" = "200" ] || { echo "deep link returned $DEEP"; exit 1; }
          UNKNOWN=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$APP_URL/api/definitely-not-a-route")
          [ "$UNKNOWN" = "404" ] || { echo "unknown API route returned $UNKNOWN"; exit 1; }
