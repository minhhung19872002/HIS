name: Deploy backend to Azure Container Apps

# Tự động build + deploy lên Azure Container Apps khi push vào main.
# Xác thực Azure bằng OIDC federated credential (keyless — không có client secret).
# Image đẩy lên GitHub Container Registry (ghcr.io) bằng GHCR_TOKEN secret.
# (Migrated off GCP Cloud Run 2026-08-02 — GCP billing delinquent.)
#
# Từ 2026-08-14 image chứa CẢ SPA (Vite build → /app/clientapp) để FE và API cùng
# origin: hết CORS, cookie first-party, SignalR chạy URL tương đối. Vì vậy build
# context là GỐC REPO và workflow chạy cả khi chỉ đổi frontend/**.
# Vercel vẫn auto-deploy song song, chưa gỡ.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.dockerignore'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

# Không cho 2 lần deploy chạy chồng nhau; lần mới xếp hàng đợi lần trước xong.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # BẮT BUỘC để lấy OIDC token cho azure/login

env:
  IMAGE_REPO: ghcr.io/minhhung19872002/his-api
  ACA_APP: his-api
  ACA_RG: rg-his

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # #191: TEST GATE — dotnet test chạy TRƯỚC build/deploy; test đỏ → job fail → KHÔNG deploy.
      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Run backend tests (gate)
        run: dotnet test backend/tests/HIS.Tests/HIS.Tests.csproj -c Release --nologo

      - name: Compute image tag
        id: img
        run: echo "tag=${IMAGE_REPO}:$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr.io
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u minhhung19872002 --password-stdin

      # Context = gốc repo (không phải backend/) vì stage 1 build luôn frontend/.
      - name: Build image
        run: docker build -f backend/src/HIS.API/Dockerfile -t "${{ steps.img.outputs.tag }}" .

      - name: Push image
        run: docker push "${{ steps.img.outputs.tag }}"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name "$ACA_APP" \
            --resource-group "$ACA_RG" \
            --image "${{ steps.img.outputs.tag }}" \
            --query "properties.latestRevisionName" -o tsv

      - name: Smoke test (login endpoint)
        run: |
          URL="https://his-api.thankfulcoast-bd0486a9.southeastasia.azurecontainerapps.io/api/auth/login"
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 120 -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"Admin@123"}') && [ "$CODE" = "200" ] && exit 0
            echo "attempt $i: HTTP $CODE — retrying in 20s"; sleep 20
          done
          echo "Smoke test failed"; exit 1

      # SPA đi kèm trong image: shell phải render được, và route server phải vẫn 404
      # thật (không được trả 200 text/html — dấu hiệu fallback nuốt nhầm /api).
      - name: Smoke test (SPA shell + fallback guard)
        run: |
          BASE="https://his-api.thankfulcoast-bd0486a9.southeastasia.azurecontainerapps.io"
          SHELL_BODY=$(curl -sS -m 60 "$BASE/")
          echo "$SHELL_BODY" | grep -q 'id="root"' || { echo "SPA shell missing"; exit 1; }
          DEEP=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$BASE/v2/reception")
          [ "$DEEP" = "200" ] || { echo "deep link returned $DEEP"; exit 1; }
          UNKNOWN=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$BASE/api/definitely-not-a-route")
          [ "$UNKNOWN" = "404" ] || { echo "unknown API route returned $UNKNOWN"; exit 1; }
