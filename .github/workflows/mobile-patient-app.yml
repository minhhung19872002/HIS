name: Mobile — App hỗ trợ người bệnh

# Kiểm app Flutter trên CẢ Android lẫn iOS, và chụp màn hình làm bằng chứng nghiệm thu.
#
# Vì sao có việc này: máy phát triển của đội là Windows nên KHÔNG build được iOS tại chỗ.
# macOS runner ở đây là đường duy nhất để chứng minh app dựng và chạy được trên iOS —
# và để chứng minh mức iOS tối thiểu đúng 12.0 như hồ sơ mời thầu yêu cầu.
#
# Tài liệu: docs/features/patient-app/README.md

on:
  push:
    branches: [main]
    paths:
      - 'mobile/patient_app/**'
      - '.github/workflows/mobile-patient-app.yml'
  pull_request:
    paths:
      - 'mobile/patient_app/**'
  workflow_dispatch:

env:
  # Bản stable CUỐI CÙNG còn target iOS 12.0 (từ 3.35.0 mức tối thiểu là 13.0).
  # Phải khớp với mobile/patient_app/.fvmrc.
  FLUTTER_VERSION: '3.32.8'
  APP_DIR: mobile/patient_app

jobs:
  android:
    name: Android (phân tích · test · build · chụp màn hình)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Xác nhận bản Flutter khớp .fvmrc
        working-directory: ${{ env.APP_DIR }}
        run: |
          PINNED=$(python3 -c "import json;print(json.load(open('.fvmrc'))['flutter'])")
          ACTUAL=$(flutter --version | head -1 | awk '{print $2}')
          echo "pin=$PINNED  đang chạy=$ACTUAL"
          # Chạy sai bản là âm thầm mất iOS 12 — thà dừng ở đây còn hơn phát hiện lúc nghiệm thu.
          [ "$PINNED" = "$ACTUAL" ] || { echo "::error::Bản Flutter không khớp .fvmrc"; exit 1; }

      - name: Lấy phụ thuộc
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Phân tích tĩnh
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      # Một plugin nâng lên bản đòi iOS 13/15 là cả app mất iOS 12 — mà `pub upgrade` vẫn báo thành
      # công và `analyze` vẫn sạch. Trên Windows không có cách nào biết vì không build được iOS.
      # Bước này soi podspec của từng plugin nên bắt được ngay, không cần macOS.
      - name: Không plugin nào được vượt iOS 12.0
        run: python3 scripts/check-ios-min-deployment-target.py ${{ env.APP_DIR }} 12.0

      - name: Chạy unit + widget test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      - name: Xác nhận minSdk = 25 (Android 7.1.1, đúng dòng "Android 7.2 trở lên" của HSMT)
        working-directory: ${{ env.APP_DIR }}
        run: |
          grep -q 'minSdk = 25' android/app/build.gradle.kts \
            || { echo "::error::minSdk không còn là 25"; exit 1; }
          echo "minSdk = 25 ✓"

      # Bản release ký bằng khoá DEBUG bị Google Play từ chối thẳng, mà lỗi đó chỉ lộ ra lúc nộp
      # lên kho — sau khi đã qua hết mọi bước khác. Chặn ngay ở đây.
      - name: Bản release KHÔNG được ký bằng khoá debug
        working-directory: ${{ env.APP_DIR }}
        run: |
          if grep -A3 'release {' android/app/build.gradle.kts | grep -q 'signingConfigs.getByName("debug")'; then
            echo "::error::buildTypes.release đang ký bằng khoá debug — Google Play sẽ từ chối"
            exit 1
          fi
          echo "release không dùng khoá debug ✓"

      - name: Build APK debug
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug

      # Nhiều lỗi CHỈ xuất hiện ở bản release: R8 cắt mất lớp gọi qua JNI/reflection thì app crash
      # ngay lúc khởi động, mà chạy debug thì không bao giờ thấy. Build thật ở đây để bắt sớm.
      - name: Build bản phát hành (AAB) — bắt lỗi R8/proguard
        working-directory: ${{ env.APP_DIR }}
        run: flutter build appbundle --release

      - name: Bản phát hành phải CHƯA được ký (chưa có khoá của bệnh viện)
        working-directory: ${{ env.APP_DIR }}
        run: |
          python3 - <<'PY'
          import sys, zipfile
          z = zipfile.ZipFile("build/app/outputs/bundle/release/app-release.aab")
          sigs = [n for n in z.namelist()
                  if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC", ".SF"))]
          if sigs:
              print(f"::error::AAB đã mang chữ ký {sigs} — khoá nào lọt vào CI?")
              sys.exit(1)
          print("AAB chưa ký ✓ (khoá thật do bệnh viện giữ, xem android/key.properties.example)")
          PY

      # Máy ảo Android trên runner cần KVM mới chạy được ở tốc độ dùng được.
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Runner ubuntu chỉ có ~14GB trống. Máy ảo cộng Gradle daemon cộng APK debug 219MB đã hai lần
      # làm runner bị GitHub tắt giữa chừng ("The runner has received a shutdown signal").
      # Dọn những bộ công cụ dựng sẵn mà job này không dùng để lấy lại vài GB.
      - name: Dọn chỗ trống trên runner
        run: |
          echo "--- trước khi dọn ---"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo apt-get clean || true
          echo "--- sau khi dọn ---"; df -h / | tail -1

      - name: Chụp màn hình trên máy ảo Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # ⚠️ API 30, KHÔNG phải 25. Job này là lưới an toàn chạy mỗi lần push — nó chứng minh app
          # dựng và đi hết được các màn, KHÔNG phải bằng chứng cho ngưỡng "Android 7.2 trở lên" của
          # HSMT. Bằng chứng cho ngưỡng đó là bộ ảnh chụp trên máy ảo **Android 7.1.1 (API 25)**
          # `HIS_Android71_API25`, chạy tay và đính vào `docs/architecture/evidence/spec-app/`
          # (xem `docs/features/patient-app/acceptance-matrix.md` dòng C.3). API 25 trên runner
          # dựng chậm và hay rớt giữa chừng nên không đặt vào đường chạy mỗi push.
          api-level: 30
          arch: x86_64
          # Ảnh "default" nhẹ hơn google_apis và ổn định hơn trên runner. Bộ chụp màn hình không cần
          # Google Play services: Firebase chưa cấu hình thì app tự tắt phần thông báo đẩy.
          target: default
          force-avd-creation: false
          # Bộ cờ này là cách khắc phục quen thuộc cho việc máy ảo "offline" giữa chừng trên runner.
          # Giới hạn RAM máy ảo: mặc định nó xin nhiều hơn phần runner còn lại sau khi Gradle
          # đã chiếm, và đó là lý do runner bị tắt giữa chừng.
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim -camera-back none
            -memory 2048 -partition-size 2048
          disable-animations: true
          working-directory: ${{ env.APP_DIR }}
          # MỘT DÒNG: action này truyền `script` vào `sh -c`, nên xuống dòng bằng dấu \ sẽ bị nuốt
          # và Flutter nhận được đối số rác (`Target file "\" not found.`).
          #
          # --no-enable-impeller: runner bị GitHub tắt đúng lúc app khởi động renderer Impeller
          # (log dừng ngay sau "Created VkInstance ... for application:'Impeller'"). Máy ảo đang
          # chạy GPU phần mềm (swiftshader), cộng thêm Vulkan là quá sức. Bản phát hành thật vẫn
          # dùng Impeller như mặc định — cờ này chỉ áp cho lần chạy trên CI.
          script: flutter drive --no-enable-impeller --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-man-hinh-android
          path: ${{ env.APP_DIR }}/screenshots/
          if-no-files-found: warn

  ios:
    name: iOS (build · chụp màn hình trên simulator · kiểm mức iOS tối thiểu)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Môi trường
        run: |
          flutter --version
          xcodebuild -version
          echo "--- simulator có sẵn ---"
          xcrun simctl list devices available | head -40

      - name: Lấy phụ thuộc
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Phân tích tĩnh
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      # Một plugin nâng lên bản đòi iOS 13/15 là cả app mất iOS 12 — mà `pub upgrade` vẫn báo thành
      # công và `analyze` vẫn sạch. Trên Windows không có cách nào biết vì không build được iOS.
      # Bước này soi podspec của từng plugin nên bắt được ngay, không cần macOS.
      - name: Không plugin nào được vượt iOS 12.0
        run: python3 scripts/check-ios-min-deployment-target.py ${{ env.APP_DIR }} 12.0

      - name: Chạy unit + widget test
        working-directory: ${{ env.APP_DIR }}
        run: flutter test

      # Bằng chứng cho hồ sơ mời thầu: mức iOS tối thiểu đúng 12.0 ở CẢ BA nơi khai báo.
      - name: Kiểm mức iOS tối thiểu = 12.0
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "--- project.pbxproj ---"
          grep -c 'IPHONEOS_DEPLOYMENT_TARGET = 12.0;' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 12.0;' ios/Runner.xcodeproj/project.pbxproj \
            || { echo "::error::project.pbxproj không còn target iOS 12.0"; exit 1; }

          echo "--- AppFrameworkInfo.plist ---"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" ios/Flutter/AppFrameworkInfo.plist

          echo "--- Podfile ---"
          grep -q "platform :ios, '12.0'" ios/Podfile \
            || { echo "::error::Podfile không còn platform :ios 12.0"; exit 1; }
          echo "Cả ba nơi đều khai iOS 12.0 ✓"

      - name: Build cho simulator (không ký số)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build ios --simulator --debug

      - name: Xác nhận sản phẩm build thật sự mang MinimumOSVersion 12.0
        working-directory: ${{ env.APP_DIR }}
        run: |
          APP=build/ios/iphonesimulator/Runner.app
          echo "MinimumOSVersion trong Info.plist của bản build:"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist"

      - name: Khởi động iPhone simulator
        id: sim
        run: |
          # Lấy iPhone khả dụng cuối cùng trong danh sách (thường là đời mới nhất trên runner).
          # Tên máy đổi theo từng bản Xcode nên bám theo tên cứng sẽ hỏng khi runner nâng cấp.
          UDID=$(xcrun simctl list devices available | grep -E '^ +iPhone' | tail -1 | grep -oE '[0-9A-Fa-f-]{36}')
          if [ -z "$UDID" ]; then echo "::error::Không tìm thấy iPhone simulator nào"; exit 1; fi
          echo "Dùng simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep Booted

      - name: Chụp màn hình trên iOS simulator
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshots_test.dart \
            -d ${{ steps.sim.outputs.udid }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-man-hinh-ios
          path: ${{ env.APP_DIR }}/screenshots/
          if-no-files-found: warn

      # Chụp thêm bằng chính simulator để có ảnh kèm khung máy iPhone, dễ đưa vào hồ sơ nghiệm thu.
      - name: Ảnh toàn màn hình simulator
        if: always()
        run: |
          mkdir -p sim-shots
          xcrun simctl io ${{ steps.sim.outputs.udid }} screenshot sim-shots/ios-simulator.png || true
          ls -la sim-shots || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anh-simulator-ios
          path: sim-shots/
          if-no-files-found: ignore
