server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Nen text de tai nhanh tren duong truyen yeu.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Tep co bam trong ten -> cache lau. index.html thi KHONG, neu khong nguoi dung se ket o
    # ban cu sau moi lan nang cap ma khong hieu vi sao.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
