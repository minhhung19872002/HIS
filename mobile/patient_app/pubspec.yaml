name: patient_app
description: "HIS - Ứng dụng hỗ trợ người bệnh"
publish_to: 'none'

version: 1.0.0+1

environment:
  # Dart 3.8 đi kèm Flutter 3.32.8 — bản stable CUỐI CÙNG còn target iOS 12.0
  # (từ Flutter 3.35.0 mức tối thiểu là iOS 13.0). HSMT yêu cầu "iOS 12.0 trở lên"
  # nên project pin ở 3.32.8 qua FVM (`.fvmrc`); xem docs/features/patient-app/README.md §6.2.
  sdk: ^3.8.0
  flutter: ">=3.32.0 <3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  go_router: ^17.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  flutter_secure_storage: 9.2.4
  local_auth: ^2.3.0
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^20.1.0
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
  permission_handler: 11.3.1
  image_picker: ^1.2.1
  file_picker: ^11.0.3
  flutter_image_compress: ^2.5.1
  webview_flutter: ^4.13.1
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  signalr_netcore: ^1.4.4
  hive_ce: ^2.19.3
  pdfrx: ^2.1.5
  biometric_signature: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.5
  mocktail: ^1.0.5
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5
  hive_ce_generator: ^1.9.2

flutter:
  # Sinh code i18n từ lib/l10n/*.arb (vi mặc định, en dự phòng) — prompt §4.1
  generate: true
  uses-material-design: true
